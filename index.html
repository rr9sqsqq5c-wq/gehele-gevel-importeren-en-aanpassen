<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFC Brickslip Planner</title>
    <meta name="theme-color" content="#1e293b" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" href="/web-ifc-api-iife.js" as="script" crossorigin="anonymous" />
    <link rel="preload" href="/web-ifc.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
    <link rel="preload" href="/web-ifc-mt.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && location.hostname === 'localhost') {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
        if (typeof caches !== 'undefined') {
          caches.keys().then(function(keys) { keys.forEach(function(k) { caches.delete(k); }); });
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
